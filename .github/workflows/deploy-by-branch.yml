name: Deploy by Branch

on:
  push:
    branches:
      - deploy/dev
      - deploy/tst
      - deploy/prd

jobs:
  deploy-dev:
    if: github.ref == 'refs/heads/deploy/dev'
    runs-on: ubuntu-latest
    environment: development
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate required secrets (dev)
        shell: bash
        run: |
          set -euo pipefail
          [[ -n "${{ secrets.GCP_CREDENTIALS_DEV }}" ]] || { echo "Missing GCP_CREDENTIALS_DEV"; exit 1; }
          [[ -n "${{ secrets.ENV_FILE_DEV }}" ]] || { echo "Missing ENV_FILE_DEV"; exit 1; }

      - name: Authenticate to GCP (dev)
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_CREDENTIALS_DEV }}

      - name: Setup gcloud CLI
        uses: google-github-actions/setup-gcloud@v2

      - name: Write env file (dev)
        shell: bash
        run: |
          cat > .env.dev.gcp.local << 'EOF'
          ${{ secrets.ENV_FILE_DEV }}
          EOF

      - name: Run dev deployment
        shell: bash
        run: |
          chmod +x ./deploy/dev/deploy-dev-cloudrun.sh
          ./deploy/dev/deploy-dev-cloudrun.sh --env-file .env.dev.gcp.local

  deploy-tst:
    if: github.ref == 'refs/heads/deploy/tst'
    runs-on: ubuntu-latest
    environment: testing
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate required secrets (tst)
        shell: bash
        run: |
          set -euo pipefail
          [[ -n "${{ secrets.GCP_CREDENTIALS_TST }}" ]] || { echo "Missing GCP_CREDENTIALS_TST"; exit 1; }
          [[ -n "${{ secrets.ENV_FILE_TST }}" ]] || { echo "Missing ENV_FILE_TST"; exit 1; }

      - name: Authenticate to GCP (tst)
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_CREDENTIALS_TST }}

      - name: Setup gcloud CLI
        uses: google-github-actions/setup-gcloud@v2

      - name: Write env file (tst)
        shell: bash
        run: |
          cat > .env.tst.gcp.local << 'EOF'
          ${{ secrets.ENV_FILE_TST }}
          EOF

      - name: Run test deployment
        shell: bash
        run: |
          chmod +x ./deploy/tst/deploy-tst-cloudrun.sh
          ./deploy/tst/deploy-tst-cloudrun.sh --env-file .env.tst.gcp.local

  deploy-prd:
    if: github.ref == 'refs/heads/deploy/prd'
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate required secrets (prd)
        shell: bash
        run: |
          set -euo pipefail
          [[ -n "${{ secrets.GCP_CREDENTIALS_PRD }}" ]] || { echo "Missing GCP_CREDENTIALS_PRD"; exit 1; }
          [[ -n "${{ secrets.ENV_FILE_PRD }}" ]] || { echo "Missing ENV_FILE_PRD"; exit 1; }

      - name: Authenticate to GCP (prd)
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_CREDENTIALS_PRD }}

      - name: Setup gcloud CLI
        uses: google-github-actions/setup-gcloud@v2

      - name: Write env file (prd)
        shell: bash
        run: |
          cat > .env.prd.gcp.local << 'EOF'
          ${{ secrets.ENV_FILE_PRD }}
          EOF

      - name: Run production deployment
        shell: bash
        run: |
          chmod +x ./deploy/prd/deploy-prd-cloudrun.sh
          ./deploy/prd/deploy-prd-cloudrun.sh --env-file .env.prd.gcp.local
