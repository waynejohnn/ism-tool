# Use Case Scoring App - Azure Pipelines (CI/CD for Linux Agents)
# This pipeline runs on Linux agents and deploys to Azure Container Apps

trigger:
  branches:
    include:
    - develop
    - feature/*
    - deploy/dev
    - deploy/tst
    - deploy/prd
  paths:
    include:
    - backend/**
    - frontend/**
    - deploy/**

pr:
  branches:
    include:
    - develop

pool:
  vmImage: 'ubuntu-latest'  # Linux agent

variables:
  dockerRegistryServiceConnection: 'da_sc_cr_dev_conn'
  azureServiceConnectionDev: 'da_sc_apps_dev_connection'
  azureServiceConnectionTst: 'da_sc_apps_tst_connection'
  azureServiceConnectionPrd: 'da_sc_apps_prd_connection'
  imageRepository: 'usecasescoringapp'
  containerRegistry: '$(REGISTRY_URL)'
  dockerfileFrontendPath: '$(Build.SourcesDirectory)/frontend/Dockerfile'
  dockerfileBackendPath: '$(Build.SourcesDirectory)/backend/Dockerfile'
  tag: '$(Build.BuildId)'
  vmImageName: 'ubuntu-latest'
  envFileDevSecure: '.env.dev.aca.local'
  envFileTstSecure: '.env.dev.aca.local'
  envFilePrdSecure: '.env.dev.aca.local'

stages:
- stage: Build
  displayName: Build Stage
  jobs:
  - job: Build
    displayName: Build and Test
    pool:
      vmImage: $(vmImageName)
    
    steps:
    - task: UseDotNet@2
      displayName: 'Install .NET'
      inputs:
        version: '6.x'
        
    - task: NodeTool@0
      displayName: 'Install Node.js'
      inputs:
        versionSpec: '18.x'
    
    - task: Bash@3
      displayName: 'Install Python dependencies (Backend)'
      inputs:
        targetType: 'inline'
        script: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt
          pip install pytest pytest-cov
    
    - task: Bash@3
      displayName: 'Lint Backend'
      inputs:
        targetType: 'inline'
        script: |
          pip install flake8
          flake8 backend/ --count --select=E9,F63,F7,F82 --show-source --statistics
    
    - task: Bash@3
      displayName: 'Test Backend'
      inputs:
        targetType: 'inline'
        script: |
          cd backend
          python -m pytest tests/ -v --cov=. --cov-report=xml --cov-report=term
      continueOnError: true
    
    - task: PublishCodeCoverageResults@1
      displayName: 'Publish Code Coverage'
      inputs:
        codeCoverageTool: Cobertura
        summaryFileLocation: '$(System.DefaultWorkingDirectory)/backend/coverage.xml'
      continueOnError: true
    
    - task: Bash@3
      displayName: 'Install Frontend dependencies'
      inputs:
        targetType: 'inline'
        script: |
          cd frontend
          npm install
    
    - task: Bash@3
      displayName: 'Lint Frontend'
      inputs:
        targetType: 'inline'
        script: |
          cd frontend
          npm run lint
      continueOnError: true
    
    - task: Bash@3
      displayName: 'Build Frontend'
      inputs:
        targetType: 'inline'
        script: |
          cd frontend
          npm run build

- stage: BuildAndPush
  displayName: Build and Push Docker Images
  dependsOn: Build
  condition: succeeded()
  jobs:
  - job: BuildAndPush
    displayName: Build and Push
    pool:
      vmImage: $(vmImageName)
    
    steps:
    - task: Docker@2
      displayName: Build Backend Image
      inputs:
        command: build
        Dockerfile: '$(dockerfileBackendPath)'
        repository: '$(imageRepository)/backend'
        containerRegistry: '$(dockerRegistryServiceConnection)'
        tags: |
          $(tag)
          latest
    
    - task: Docker@2
      displayName: Build Frontend Image
      inputs:
        command: build
        Dockerfile: '$(dockerfileFrontendPath)'
        repository: '$(imageRepository)/frontend'
        containerRegistry: '$(dockerRegistryServiceConnection)'
        tags: |
          $(tag)
          latest
    
    - task: Docker@2
      displayName: Push Backend Image
      inputs:
        command: push
        repository: '$(imageRepository)/backend'
        containerRegistry: '$(dockerRegistryServiceConnection)'
        tags: |
          $(tag)
          latest
    
    - task: Docker@2
      displayName: Push Frontend Image
      inputs:
        command: push
        repository: '$(imageRepository)/frontend'
        containerRegistry: '$(dockerRegistryServiceConnection)'
        tags: |
          $(tag)
          latest

- stage: DeployDev
  displayName: Deploy to Dev (ACA)
  dependsOn: BuildAndPush
  condition: and(succeeded(), eq(variables['Build.SourceBranch'], 'refs/heads/deploy/dev'))
  jobs:
  - deployment: DeployDev
    displayName: Deploy to Dev
    pool:
      vmImage: $(vmImageName)
    environment: 'Development'
    strategy:
      runOnce:
        deploy:
          steps:
          - checkout: self

          - task: DownloadSecureFile@1
            name: DownloadDevEnv
            displayName: 'Download Dev Environment File'
            inputs:
              secureFile: '$(envFileDevSecure)'
          
          - task: AzureCLI@2
            displayName: 'Deploy to Azure Container Apps (Dev)'
            inputs:
              azureSubscription: '$(azureServiceConnectionDev)'
              scriptType: bash
              scriptLocation: scriptPath
              scriptPath: '$(Build.SourcesDirectory)/deploy/dev/deploy-dev-aca.sh'
              arguments: '--env-file $(DownloadDevEnv.secureFilePath) --skip-resources'
              workingDirectory: '$(Build.SourcesDirectory)'
            env:
              SYSTEM_ACCESSTOKEN: $(System.AccessToken)

- stage: DeployTesting
  displayName: Deploy to Testing (ACA)
  dependsOn: BuildAndPush
  condition: and(succeeded(), eq(variables['Build.SourceBranch'], 'refs/heads/deploy/tst'))
  jobs:
  - deployment: DeployTesting
    displayName: Deploy to Testing
    pool:
      vmImage: $(vmImageName)
    environment: 'Testing'
    strategy:
      runOnce:
        deploy:
          steps:
          - checkout: self

          - task: DownloadSecureFile@1
            name: DownloadTstEnv
            displayName: 'Download Test Environment File'
            inputs:
              secureFile: '$(envFileTstSecure)'
          
          - task: AzureCLI@2
            displayName: 'Deploy to Azure Container Apps (Testing)'
            inputs:
              azureSubscription: '$(azureServiceConnectionTst)'
              scriptType: bash
              scriptLocation: scriptPath
              scriptPath: '$(Build.SourcesDirectory)/deploy/tst/deploy-tst-aca.sh'
              arguments: '--env-file $(DownloadTstEnv.secureFilePath) --skip-resources'
              workingDirectory: '$(Build.SourcesDirectory)'
            env:
              SYSTEM_ACCESSTOKEN: $(System.AccessToken)

- stage: DeployProduction
  displayName: Deploy to Production (ACA)
  dependsOn: BuildAndPush
  condition: and(succeeded(), eq(variables['Build.SourceBranch'], 'refs/heads/deploy/prd'))
  jobs:
  - deployment: DeployProduction
    displayName: Deploy to Production
    pool:
      vmImage: $(vmImageName)
    environment: 'Production'
    strategy:
      runOnce:
        deploy:
          steps:
          - checkout: self

          - task: DownloadSecureFile@1
            name: DownloadPrdEnv
            displayName: 'Download Production Environment File'
            inputs:
              secureFile: '$(envFilePrdSecure)'
          
          - task: Bash@3
            displayName: 'Manual Approval Required'
            inputs:
              targetType: 'inline'
              script: |
                echo "Production deployment requires manual approval"
                echo "Contact the DevOps team to proceed"
          
          - task: AzureCLI@2
            displayName: 'Deploy to Azure Container Apps (Production)'
            inputs:
              azureSubscription: '$(azureServiceConnectionPrd)'
              scriptType: bash
              scriptLocation: scriptPath
              scriptPath: '$(Build.SourcesDirectory)/deploy/prd/deploy-prd-aca.sh'
              arguments: '--env-file $(DownloadPrdEnv.secureFilePath) --skip-resources'
              workingDirectory: '$(Build.SourcesDirectory)'
            env:
              SYSTEM_ACCESSTOKEN: $(System.AccessToken)
